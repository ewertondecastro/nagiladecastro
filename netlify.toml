[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Mentorias viraram Consultorias. As regras específicas vêm antes das
# curingas porque o Netlify usa a primeira que casar.

[[redirects]]
  from = "/mentorias/homeschool"
  to = "/consultorias/primeiros-passos"
  status = 301
  force = true

[[redirects]]
  from = "/en/mentorias/homeschool"
  to = "/consultorias/primeiros-passos"
  status = 301
  force = true

[[redirects]]
  from = "/es/mentorias/homeschool"
  to = "/consultorias/primeiros-passos"
  status = 301
  force = true

[[redirects]]
  from = "/mentorias/*"
  to = "/consultorias/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/en/mentorias/*"
  to = "/consultorias/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/es/mentorias/*"
  to = "/consultorias/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/mentorias"
  to = "/consultorias"
  status = 301
  force = true

[[redirects]]
  from = "/en/mentorias"
  to = "/consultorias"
  status = 301
  force = true

[[redirects]]
  from = "/es/mentorias"
  to = "/consultorias"
  status = 301
  force = true


# Inglês e espanhol desativados por ora: o site público é só em português.
# Status 302 porque a desativação é temporária — os dicionários en.json e
# es.json continuam no projeto e as rotas estão no histórico do git.
# Cada página vai para a equivalente em PT; o que não tem equivalente cai
# na home. As regras específicas vêm antes das curingas.

[[redirects]]
  from = "/en/consultorias/*"
  to = "/consultorias/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/en/consultorias"
  to = "/consultorias"
  status = 302
  force = true

[[redirects]]
  from = "/en/sobre"
  to = "/sobre"
  status = 302
  force = true

[[redirects]]
  from = "/en/recursos"
  to = "/recursos"
  status = 302
  force = true

[[redirects]]
  from = "/es/consultorias/*"
  to = "/consultorias/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/es/consultorias"
  to = "/consultorias"
  status = 302
  force = true

[[redirects]]
  from = "/es/sobre"
  to = "/sobre"
  status = 302
  force = true

[[redirects]]
  from = "/es/recursos"
  to = "/recursos"
  status = 302
  force = true

[[redirects]]
  from = "/en/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/en"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/es/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/es"
  to = "/"
  status = 302
  force = true
